<!DOCTYPE html>
<html>
<head>
    <title>Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Crear Cuenta</h2>
        <form id="signupForm">
            <input type="text" placeholder="Nombre" required>
            <input type="text" id="signupUser" placeholder="Usuario" required>
            <input type="email" id="signupEmail" placeholder="Correo" required>
            <input type="password" id="signupPass" placeholder="Contraseña" required>
            <input type="password" id="signupConfirm" placeholder="Confirmar contraseña" required>
            <button type="submit">Registrarme</button>
        </form>

        <p id="signupMsg" class="texto-gris"></p>

        <p class="texto-gris"><br>¿Ya tienes cuenta?</p>
        <a href="login.html" class="boton-link">Volver al login</a>
    </div>

    <script src="scripts/signup.js"></script>
</body>
</html>
